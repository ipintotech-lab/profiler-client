[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profiler-client"
version = "0.2.0"
description = "Prepare AI agent traces for the AI Agent Profiler locally: pseudonymized, privacy-checked, never sent without you"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
profiler-client = "profiler_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
