name: claude-build

# The factory's build step: Claude Code works on an issue labelled `factory`,
# or on an issue or PR comment that mentions @claude. It pushes a branch and
# posts a "Create PR" link; a person opens the PR. Rules: AGENTS.md.
# Runs on the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), no API key.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: factory-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    # Only for issues and comments written by people with write access. The
    # action checks the trigger's permission too; this also keeps out the
    # text of an issue someone else wrote.
    if: >-
      (github.event_name == 'issues'
        && github.event.label.name == 'factory'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      || (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # keep the job's token out of .git/config while the PR's install runs;
          # claude-code-action sets up its own git credentials
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the same set-up as test.yml, so the agent can run the tests before it pushes
      - run: pip install -e '.[dev]'
      - id: claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # only these people's comments reach the agent (default: everyone's)
          include_comments_by_actor: ipintotech-lab,TomerDanielGH
          label_trigger: factory
          claude_args: --max-turns 40
      # No trace upload here, unlike the server: this repo is public, so
      # anyone could download the artifact, and it holds the whole transcript.
