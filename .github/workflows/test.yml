name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]' ruff
      - run: ruff check src tests
      - run: pytest -q

  telemetry-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ipintotech-lab/agents_profiler
          ref: main
          token: ${{ secrets.SERVER_REPO_READ_TOKEN }}
          path: agents-profiler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "agents-profiler[dev]" ruff
      - run: PYTHONPATH=agents-profiler/src python agents-profiler/scripts/telemetry_e2e.py --client-repo .
