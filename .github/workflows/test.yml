name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: python scripts/check_version.py
      - run: pytest -q

  test-windows:
    # the console code page, file modes, DPAPI and signals differ on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q -rs

  smoke-windows:
    # the installed command as a user runs it on Windows: a regular (not editable) install,
    # profiler-client.exe from PowerShell and cmd with the console's own code page, paths with
    # spaces and non-ASCII letters, a DPAPI key file, and the app started and stopped with Ctrl-Break
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        shell: [pwsh, cmd]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python scripts/cli_smoke.py

  telemetry-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ipintotech-lab/agents_profiler
          ref: main
          token: ${{ secrets.SERVER_REPO_READ_TOKEN }}
          path: agents-profiler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "agents-profiler[dev]" ruff
      - run: PYTHONPATH=agents-profiler/src python agents-profiler/scripts/telemetry_e2e.py --client-repo .
