name: claude-review

# The factory's review step: a separate Claude Code run reviews each PR by the
# "Code Review Rules" in AGENTS.md and posts one comment. It never approves,
# requests changes, pushes or merges. Codex reviews separately through the
# ChatGPT Codex GitHub connector, by the same rules.
# Runs on the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), no API key.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # no drafts; no PRs from forks (they get no secrets)
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # keep the job's token out of .git/config while the PR's install runs;
          # claude-code-action sets up its own git credentials
          persist-credentials: false
          fetch-depth: 0  # the reviewer diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the reviewer runs the tests
      - run: pip install -e '.[dev]'
      - id: claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # only these people's comments reach the agent (default: everyone's)
          include_comments_by_actor: ipintotech-lab,TomerDanielGH
          # the job's token (contents: read), not the Claude App's, which can push
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by the "Code Review Rules" section of AGENTS.md.
            Read the issue it closes and the diff against origin/main (fetched),
            and run the tests the change touches. Then post ONE comment with
            `gh pr comment`, blocking findings first. This repo is public:
            quote no secrets or personal data. Change no file, push nothing, and never
            approve, request changes or merge.
          claude_args: --max-turns 40 --disallowedTools "Edit,Write,NotebookEdit"
      # No trace upload here, unlike the server: this repo is public, so
      # anyone could download the artifact, and it holds the whole transcript.
